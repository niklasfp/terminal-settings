name: CI

# Docs-only changes skip CI. If required status checks are ever added, a skipped workflow leaves
# them pending, so this would then need a no-op fallback job or a changed-files gate instead.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: editor/gpui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-gpui
        with:
          cache-key: test
          components: clippy

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The UI tests drive the real window headlessly, so they run on every OS.
      - name: Test
        run: cargo test --workspace --locked

  # The browser playground. Its UI tests run natively above; this keeps the wasm build itself from
  # breaking unnoticed. The Pages workflow deploys the same build from main.
  web:
    name: Web playground build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-gpui
        with:
          cache-key: web
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Lint
        working-directory: editor/gpui
        run: cargo clippy -p settings-web --target wasm32-unknown-unknown --locked -- -D warnings

      - uses: ./.github/actions/build-web

  build:
    name: Release build ${{ matrix.app }} (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: rio-settings, os: ubuntu-latest, rid: linux-x64 }
          - { app: rio-settings, os: macos-latest, rid: osx-arm64 }
          - { app: rio-settings, os: windows-latest, rid: win-x64 }
          - { app: ghostty-settings, os: ubuntu-latest, rid: linux-x64 }
          - { app: ghostty-settings, os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: editor/gpui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-gpui
        with:
          cache-key: release-${{ matrix.app }}

      - name: Build
        env:
          APP: ${{ matrix.app }}
          SETTINGS_VERSION: 0.0.0-ci
        run: cargo build --release --locked -p "$APP"

      - name: Smoke test
        env:
          APP: ${{ matrix.app }}
        run: |
          exe="target/release/$APP"
          [[ "$RUNNER_OS" == "Windows" ]] && exe="$exe.exe"
          ls -l "$exe"
          # --version must exit 0 (the step fails otherwise) and print the stamped version.
          out="$("$exe" --version)"
          echo "$out"
          [[ "$out" == *"0.0.0-ci"* ]] || { echo "::error::$APP --version did not report 0.0.0-ci"; exit 1; }
