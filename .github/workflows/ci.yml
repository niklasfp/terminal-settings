name: CI

# Docs-only changes skip CI. If required status checks are ever added, a skipped workflow leaves
# them pending, so this would then need a no-op fallback job or a changed-files gate instead.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build TerminalSettings.slnx -c Release

      # Never pass --nologo here: on .NET 10 Microsoft.Testing.Platform it makes the run execute zero tests.
      - name: Test
        run: dotnet test --solution TerminalSettings.slnx -c Release --no-build

  aot:
    name: AOT publish ${{ matrix.app }} (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: rio-settings, project: RioSettings, os: ubuntu-latest, rid: linux-x64 }
          - { app: rio-settings, project: RioSettings, os: macos-latest, rid: osx-arm64 }
          - { app: rio-settings, project: RioSettings, os: windows-latest, rid: win-x64 }
          - { app: ghostty-settings, project: GhosttySettings, os: ubuntu-latest, rid: linux-x64 }
          - { app: ghostty-settings, project: GhosttySettings, os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: editor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Publish (Native AOT)
        run: >
          dotnet publish src/${{ matrix.project }}/${{ matrix.project }}.csproj
          -c Release -r ${{ matrix.rid }} -o "$RUNNER_TEMP/publish"
          -p:Version=0.0.0-ci

      - name: Smoke test
        env:
          APP: ${{ matrix.app }}
        run: |
          exe="$RUNNER_TEMP/publish/$APP"
          [[ "$RUNNER_OS" == "Windows" ]] && exe="$exe.exe"
          ls -l "$RUNNER_TEMP/publish"
          # --version must exit 0 (the step fails otherwise) and print the stamped version.
          out="$("$exe" --version)"
          echo "$out"
          [[ "$out" == *"0.0.0-ci"* ]] || { echo "::error::$APP --version did not report 0.0.0-ci"; exit 1; }
