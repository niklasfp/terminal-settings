name: Release

# Pushing a tag `<app>/v<semver>` (e.g. `git tag rio-settings/v1.2.3 && git push origin rio-settings/v1.2.3`)
# builds that app for every target it ships on (assets named <app>-<version>-<rid>.*; a zipped .app
# on macOS, .tar.gz on Linux, .zip on Windows), creates the GitHub release as a draft with the
# archives and SHA256SUMS attached, and then publishes it.
# The repo uses immutable releases: a published release is locked, so assets must be attached
# while it is still a draft.
#
# Release notes: release-notes/<app>/<version>.md if it exists, else the annotated tag's message,
# else GitHub-generated notes. Versions with a pre-release suffix (1.2.3-alpha.1) are marked as
# pre-releases.
#
# Running it by hand (workflow_dispatch) is a dry run: the same builds, with the assets kept as
# workflow artifacts and nothing released.

on:
  push:
    tags:
      - "rio-settings/v*"
      - "ghostty-settings/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to dry-run, e.g. rio-settings/v1.2.3 (nothing is released)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Parse tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      app: ${{ steps.parse.outputs.app }}
      version: ${{ steps.parse.outputs.version }}
      matrix: ${{ steps.parse.outputs.matrix }}
      dry_run: ${{ steps.parse.outputs.dry_run }}
    steps:
      - name: Parse app and version from the tag
        id: parse
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          semver='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?'
          if [[ ! "$TAG" =~ ^(rio-settings|ghostty-settings)/v($semver)$ ]]; then
            echo "::error::Tag '$TAG' is not '<app>/v<semver>', where <app> is rio-settings or ghostty-settings (e.g. rio-settings/v1.2.3)."
            exit 1
          fi
          app="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[2]}"

          case "$app" in
            rio-settings)
              matrix='{"include":[
                {"rid":"osx-arm64","os":"macos-latest"},
                {"rid":"linux-x64","os":"ubuntu-latest"},
                {"rid":"linux-arm64","os":"ubuntu-24.04-arm"},
                {"rid":"win-x64","os":"windows-latest"},
                {"rid":"win-arm64","os":"windows-11-arm"}]}' ;;
            ghostty-settings)
              # Ghostty has no Windows version, so neither does its editor.
              matrix='{"include":[
                {"rid":"osx-arm64","os":"macos-latest"},
                {"rid":"linux-x64","os":"ubuntu-latest"},
                {"rid":"linux-arm64","os":"ubuntu-24.04-arm"}]}' ;;
          esac

          dry_run=false
          [[ "$EVENT" == "workflow_dispatch" ]] && dry_run=true

          {
            echo "tag=$TAG"
            echo "app=$app"
            echo "version=$version"
            echo "matrix=$(jq -c . <<<"$matrix")"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"
          echo "### $app $version (dry run: $dry_run)" >> "$GITHUB_STEP_SUMMARY"

  # Every target builds natively on its own runner.
  build:
    name: ${{ needs.prepare.outputs.app }} ${{ matrix.rid }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      APP: ${{ needs.prepare.outputs.app }}
      VERSION: ${{ needs.prepare.outputs.version }}
      RID: ${{ matrix.rid }}
      # Stamped into --version and, on macOS, the bundle's Info.plist.
      SETTINGS_VERSION: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      # A tag push builds the tagged commit; a dry run builds the ref it was dispatched on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-gpui
        with:
          cache-key: dist-${{ needs.prepare.outputs.app }}

      # The macOS bundler is a TypeScript script run with Node's own type stripping.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: runner.os == 'macOS'
        with:
          node-version: 24

      - name: Build the app bundle (macOS)
        if: runner.os == 'macOS'
        working-directory: editor
        run: node tools/gpui/package-macos.ts --app "$APP"

      - name: Build
        if: runner.os != 'macOS'
        working-directory: editor/gpui
        run: cargo build --locked --profile dist -p "$APP"

      - name: Check the executable reports the version
        run: |
          ext=""; [[ "$RUNNER_OS" == "Windows" ]] && ext=".exe"
          # --version must exit 0 (the step fails otherwise) and print the stamped version.
          out="$("editor/gpui/target/dist/$APP$ext" --version)"
          echo "$out"
          [[ "$out" == *"$VERSION"* ]] || { echo "::error::$APP --version printed '$out', expected $VERSION"; exit 1; }

      - name: Package
        run: |
          ext=""; [[ "$RUNNER_OS" == "Windows" ]] && ext=".exe"
          name="$APP-$VERSION-$RID"
          dist="$RUNNER_TEMP/dist"
          stage="$RUNNER_TEMP/stage/$name"
          mkdir -p "$dist" "$stage"

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # The ad-hoc signed .app, zipped by the bundler (ditto keeps the signature intact).
            cp "editor/gpui/target/macos/$APP-macos-arm64.zip" "$dist/$name.zip"
          else
            cp "editor/gpui/target/dist/$APP$ext" "$stage/$APP$ext"
            for doc in README.md LICENSE THIRD-PARTY-NOTICES.md; do
              [[ -f "$doc" ]] && cp "$doc" "$stage/"
            done
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              pwsh -NoProfile -Command "Compress-Archive -Path '$(cygpath -w "$stage")' -DestinationPath '$(cygpath -w "$dist/$name.zip")'"
            else
              chmod +x "$stage/$APP"
              tar -C "$RUNNER_TEMP/stage" -czf "$dist/$name.tar.gz" "$name"
            fi
          fi
          ls -l "$dist"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.APP }}-${{ env.VERSION }}-${{ matrix.rid }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  publish:
    name: ${{ needs.prepare.outputs.dry_run == 'true' && 'Collect assets (dry run)' || 'Publish release' }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      APP: ${{ needs.prepare.outputs.app }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # Only for release-notes/<app>/<version>.md.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: release-notes

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ needs.prepare.outputs.app }}-${{ needs.prepare.outputs.version }}-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: ${{ runner.temp }}/dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          ls -l

      - name: Keep the assets as one artifact (dry run)
        if: needs.prepare.outputs.dry_run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.prepare.outputs.app }}-${{ needs.prepare.outputs.version }}-release-assets
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

      - name: Create the release as a draft, attach assets, publish
        if: needs.prepare.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          DIST="$RUNNER_TEMP/dist"
          flags=(--title "$APP $VERSION" --verify-tag)
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          notes="release-notes/$APP/$VERSION.md"
          if [[ -f "$notes" ]]; then
            flags+=(--notes-file "$notes")
          elif [[ "$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.type)" == "tag" ]]; then
            flags+=(--notes-from-tag)
          else
            flags+=(--generate-notes)
          fi

          state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          case "$state" in
            missing) gh release create "$TAG" --draft "${flags[@]}" "$DIST"/* ;;
            true)    gh release upload "$TAG" --clobber "$DIST"/* ;;
            *)       echo "::error::Release $TAG is already published, and published releases are immutable. Push a new version tag instead."; exit 1 ;;
          esac

          # Publishing locks the release (immutable releases), so it happens last.
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json url,isPrerelease,assets --jq '"\(.url) prerelease=\(.isPrerelease) assets=\(.assets | length)"'
