name: Release

# Publishing a GitHub release whose tag is `<app>/v<semver>` (e.g. `rio-settings/v1.2.3`)
# builds that app with Native AOT for every target it ships on and attaches the executables,
# archives and a SHA256SUMS file to the release.
#
# Running it by hand (workflow_dispatch) is a dry run: the same builds, with the assets kept
# as workflow artifacts and nothing uploaded to a release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to dry-run, e.g. rio-settings/v1.2.3 (nothing is uploaded to a release)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  prepare:
    name: Parse tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      app: ${{ steps.parse.outputs.app }}
      version: ${{ steps.parse.outputs.version }}
      matrix: ${{ steps.parse.outputs.matrix }}
      dry_run: ${{ steps.parse.outputs.dry_run }}
    steps:
      - name: Parse app and version from the tag
        id: parse
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          semver='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?'
          if [[ ! "$TAG" =~ ^(rio-settings|ghostty-settings)/v($semver)$ ]]; then
            echo "::error::Tag '$TAG' is not '<app>/v<semver>', where <app> is rio-settings or ghostty-settings (e.g. rio-settings/v1.2.3)."
            exit 1
          fi
          app="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[2]}"

          case "$app" in
            rio-settings)
              matrix='{"include":[
                {"project":"RioSettings","rid":"osx-arm64","os":"macos-latest"},
                {"project":"RioSettings","rid":"linux-x64","os":"ubuntu-latest"},
                {"project":"RioSettings","rid":"linux-arm64","os":"ubuntu-24.04-arm"},
                {"project":"RioSettings","rid":"win-x64","os":"windows-latest"},
                {"project":"RioSettings","rid":"win-arm64","os":"windows-11-arm"}]}' ;;
            ghostty-settings)
              # Ghostty has no Windows version, so neither does its editor.
              matrix='{"include":[
                {"project":"GhosttySettings","rid":"osx-arm64","os":"macos-latest"},
                {"project":"GhosttySettings","rid":"linux-x64","os":"ubuntu-latest"},
                {"project":"GhosttySettings","rid":"linux-arm64","os":"ubuntu-24.04-arm"}]}' ;;
          esac

          dry_run=false
          [[ "$EVENT" == "workflow_dispatch" ]] && dry_run=true

          {
            echo "tag=$TAG"
            echo "app=$app"
            echo "version=$version"
            echo "matrix=$(jq -c . <<<"$matrix")"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"
          echo "### $app $version (dry run: $dry_run)" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ needs.prepare.outputs.app }} ${{ matrix.rid }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      APP: ${{ needs.prepare.outputs.app }}
      VERSION: ${{ needs.prepare.outputs.version }}
      RID: ${{ matrix.rid }}
    defaults:
      run:
        shell: bash
    steps:
      # A release builds the tagged commit; a dry run builds the ref it was dispatched on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && needs.prepare.outputs.tag || '' }}
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Publish (Native AOT)
        working-directory: editor
        run: >
          dotnet publish src/${{ matrix.project }}/${{ matrix.project }}.csproj
          -c Release -r "$RID" -o "$RUNNER_TEMP/publish"
          -p:Version="$VERSION"

      - name: Check the executable reports the version
        run: |
          ext=""; [[ "$RUNNER_OS" == "Windows" ]] && ext=".exe"
          # --version must exit 0 (the step fails otherwise) and print the stamped version.
          out="$("$RUNNER_TEMP/publish/$APP$ext" --version)"
          echo "$out"
          [[ "$out" == *"$VERSION"* ]] || { echo "::error::$APP --version printed '$out', expected $VERSION"; exit 1; }

      - name: Package
        run: |
          ext=""; [[ "$RUNNER_OS" == "Windows" ]] && ext=".exe"
          name="$APP-$VERSION-$RID"
          dist="$RUNNER_TEMP/dist"
          stage="$RUNNER_TEMP/stage/$name"
          mkdir -p "$dist" "$stage"

          # Only the executable ships: no .dSYM/.pdb symbols.
          cp "$RUNNER_TEMP/publish/$APP$ext" "$dist/$name$ext"
          cp "$RUNNER_TEMP/publish/$APP$ext" "$stage/$APP$ext"
          for doc in README.md LICENSE THIRD-PARTY-NOTICES.md; do
            [[ -f "$doc" ]] && cp "$doc" "$stage/"
          done

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            pwsh -NoProfile -Command "Compress-Archive -Path '$(cygpath -w "$stage")' -DestinationPath '$(cygpath -w "$dist/$name.zip")'"
          else
            chmod +x "$dist/$name" "$stage/$APP"
            tar -C "$RUNNER_TEMP/stage" -czf "$dist/$name.tar.gz" "$name"
          fi
          ls -l "$dist"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.APP }}-${{ env.VERSION }}-${{ matrix.rid }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  publish:
    name: ${{ needs.prepare.outputs.dry_run == 'true' && 'Collect assets (dry run)' || 'Attach assets to release' }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      APP: ${{ needs.prepare.outputs.app }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ needs.prepare.outputs.app }}-${{ needs.prepare.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          ls -l

      - name: Keep the assets as one artifact (dry run)
        if: needs.prepare.outputs.dry_run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.prepare.outputs.app }}-${{ needs.prepare.outputs.version }}-release-assets
          path: dist/
          if-no-files-found: error

      - name: Upload to the release
        if: needs.prepare.outputs.dry_run != 'true'
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload --clobber "$TAG" ./*
