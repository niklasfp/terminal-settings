version: 2

updates:
  - package-ecosystem: github-actions
    # The workflows and the local composite actions they share.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /editor/gpui
    schedule:
      interval: weekly
    groups:
      # GPUI Kit pins its GPUI snapshot exactly; its crates move together, in their own PR.
      gpui-kit:
        patterns:
          - "gpui*"
      minor-and-patch:
        patterns:
          - "*"
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /editor/tools/rio/schema-dump
    schedule:
      interval: weekly
    ignore:
      # Bumping rio-backend means regenerating the schema on purpose, not via a bot PR.
      - dependency-name: rio-backend
    groups:
      serde-and-toml:
        patterns:
          - "serde*"
          - "toml*"
