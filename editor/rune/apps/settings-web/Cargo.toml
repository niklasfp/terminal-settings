[package]
name = "settings-web-rune"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The browser playground on Rune: both editors in one WebAssembly module, picked with
# `?app=rio|ghostty`. Built with `node tools/web/build.ts --rune` (cargo + wasm-bindgen).
[lib]
crate-type = ["cdylib", "rlib"]

# Everything is wasm-only, so a native workspace build compiles an empty crate.
[target.'cfg(target_arch = "wasm32")'.dependencies]
settings-rune.workspace = true
rio-config.workspace = true
ghostty-config.workspace = true
rio-settings-rune = { path = "../rio-settings" }
ghostty-settings-rune = { path = "../ghostty-settings" }
# WebGL2 when the browser has no WebGPU, as the GPUI playground does.
rune = { workspace = true, features = ["webgl"] }
# Rune's `webgl` doesn't build alone: wgpu's GL backend isn't Send/Sync, and Rune keeps its
# instance in a static. The page is single-threaded, so wgpu may claim both.
wgpu = { version = "30", default-features = false, features = ["fragile-send-sync-non-atomic-wasm"] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Clipboard",
    "CssStyleDeclaration",
    "DataTransfer",
    "DragEvent",
    "Document",
    "Element",
    "Event",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlElement",
    "HtmlInputElement",
    "Location",
    "Navigator",
    "Response",
    "Url",
    "Window",
] }
futures-channel = "0.3"
